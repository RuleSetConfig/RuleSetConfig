# Five upstream lists from the AdGuard Hostlists Registry. See README credits.
name: Build Merged AdGuard Filters

on:
  schedule:
    # UTC 21:13 = 05:13 next day in UTC+8.
    - cron: "13 21 * * *"
  workflow_dispatch:
    inputs:
      accept_large_change:
        description: Allow an unusual rule-count change after manual review
        required: false
        type: boolean
        default: false

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"
  FILTER_SETS: "REJECT-DOMAIN-SET REJECT-IP-SET REJECT-RULE-SET"

permissions:
  contents: write

concurrency:
  group: ruleset-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose isolated candidate directory
        run: echo "FILTER_BUILD_DIR=${RUNNER_TEMP}/filter-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Test filter semantics
        run: python3 -m unittest discover -s tests -v

      - name: Download the five upstream lists
        run: |
          set -euo pipefail
          mkdir -p "$FILTER_BUILD_DIR/upstream"
          curl_args=(--fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300)
          for id in 1 2 5 53 59; do
            curl "${curl_args[@]}" \
              -o "$FILTER_BUILD_DIR/upstream/filter_${id}.txt" \
              "https://adguardteam.github.io/HostlistsRegistry/assets/filter_${id}.txt"
          done
          wc -l "$FILTER_BUILD_DIR"/upstream/*.txt

      - name: Merge, deduplicate and partition rules
        run: |
          set -euo pipefail
          python3 scripts/merge-filter.py build \
            --adblock "$FILTER_BUILD_DIR/upstream/filter_1.txt" \
            --adblock "$FILTER_BUILD_DIR/upstream/filter_2.txt" \
            --adblock "$FILTER_BUILD_DIR/upstream/filter_5.txt" \
            --adblock "$FILTER_BUILD_DIR/upstream/filter_53.txt" \
            --adblock "$FILTER_BUILD_DIR/upstream/filter_59.txt" \
            --output-dir "$FILTER_BUILD_DIR"

      - name: Summarize conversion and upstream exceptions
        run: |
          python3 -c 'import json, os; from pathlib import Path; d=json.loads((Path(os.environ["FILTER_BUILD_DIR"])/"filter-audit.json").read_text()); print("## Filter partitions\n\nFile | Rules\n--- | ---:"); [print(name+".list", count, sep=" | ") for name, count in d["result"]["partitions"].items()]; print("\nException policy:", d["exception_policy"]); print("Overlapping exception domains:", d["result"]["overlapping_exception_domains"]); print("\nSource | Suffix | Exact | Parsed/skipped lines\n--- | ---: | ---: | ---"); [print(name, s["block_suffix"], s["block_exact"], json.dumps(s["counts"], sort_keys=True), sep=" | ") for name, s in d["sources"].items()]' >> "$GITHUB_STEP_SUMMARY"

      - name: Save filter audit for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filter-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FILTER_BUILD_DIR }}/filter-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Guard all candidate sizes
        env:
          ACCEPT_LARGE_CHANGE: ${{ inputs.accept_large_change || 'false' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$ACCEPT_LARGE_CHANGE" == "true" ]]; then
            extra+=(--allow-large-change)
          fi
          read -r -a names <<< "$FILTER_SETS"
          for name in "${names[@]}"; do
            optional=()
            if [[ "$name" != "REJECT-DOMAIN-SET" ]]; then
              optional+=(--allow-empty)
            fi
            python3 scripts/guard-ruleset.py \
              --baseline "$name.list" --candidate "$FILTER_BUILD_DIR/$name.list" \
              --min-ratio 0.80 --max-ratio 1.25 --max-rules 300000 \
              "${extra[@]}" "${optional[@]}"
          done

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Test native sing-box matching
        run: python3 tests/native_filter.py

      - name: Compile and verify every candidate before staging
        run: |
          set -euo pipefail
          read -r -a names <<< "$FILTER_SETS"
          for name in "${names[@]}"; do
            sing-box rule-set compile \
              --output "$FILTER_BUILD_DIR/$name.srs" "$FILTER_BUILD_DIR/$name.json"
            sing-box rule-set decompile \
              -o "$FILTER_BUILD_DIR/$name.compiled.json" "$FILTER_BUILD_DIR/$name.srs"
            python3 scripts/verify-all.py \
              --list "$FILTER_BUILD_DIR/$name.list" \
              --decompiled "$FILTER_BUILD_DIR/$name.compiled.json"
          done
          # Only stage outputs once all three pairs have passed.
          for name in "${names[@]}"; do
            install -m 0644 "$FILTER_BUILD_DIR/$name.list" "$name.list"
            install -m 0644 "$FILTER_BUILD_DIR/$name.srs" "$name.srs"
          done

      - name: Write deterministic provenance manifest
        run: |
          set -euo pipefail
          sources=()
          for id in 1 2 5 53 59; do
            sources+=(--source "filter_${id}|$FILTER_BUILD_DIR/upstream/filter_${id}.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_${id}.txt")
          done
          outputs=()
          read -r -a names <<< "$FILTER_SETS"
          for name in "${names[@]}"; do
            outputs+=(--output "$name.list" --output "$name.srs")
          done
          python3 scripts/write-manifest.py \
            --name filter --sing-box-version "$SB_VERSION" \
            "${sources[@]}" "${outputs[@]}" \
            --audit "$FILTER_BUILD_DIR/filter-audit.json" \
            --manifest metadata/filter.json

      - name: Verify every committed pair and manifest
        run: python3 scripts/verify-all.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          outputs=()
          read -r -a names <<< "$FILTER_SETS"
          for name in "${names[@]}"; do
            outputs+=("$name.list" "$name.srs")
          done
          bash scripts/publish-rulesets.sh \
            "chore: sync filter rules $(date -u +%Y-%m-%d)" \
            "${outputs[@]}" metadata/filter.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
