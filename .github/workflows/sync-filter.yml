# Upstream data: AdGuard DNS filter (filter_1) and AdGuard DNS Popup Hosts
# filter (filter_59) under GPL-3.0, the AdAway default blocklist (filter_2)
# under CC BY 3.0, AWAvenue Ads Rule (filter_53) under GPL-3.0, and Peter
# Lowe's Blocklist (filter_3) under the McRae General Public License, all
# published through the AdGuard Hostlists Registry; plus the domestic entries
# of OISD Blocklist Big (filter_27) under GPL-3.0, and anti-AD's auto number
# verification list under MIT. See README "Sources & Credits".
name: Sync Filter Rules

on:
  schedule:
    # UTC 21:13 = 05:13 next day in UTC+8. Avoid the top of the hour: GitHub
    # delays scheduled runs by up to a few hours when the queue is busy.
    - cron: "13 21 * * *"
  workflow_dispatch:
    inputs:
      accept_large_change:
        description: Allow an unusual rule-count change after manual review
        required: false
        type: boolean
        default: false

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

permissions:
  contents: write

concurrency:
  # Every publishing workflow shares this group so two jobs never push at once.
  group: ruleset-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0
          persist-credentials: false

      - name: Choose isolated candidate directory
        run: echo "FILTER_BUILD_DIR=${RUNNER_TEMP}/filter-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Test filter semantics
        run: python3 -m unittest discover -s tests -v

      - name: Download upstream filter lists
        run: |
          set -euo pipefail
          curl_args=(--fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300)
          curl "${curl_args[@]}" -o /tmp/adguard_dns.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"
          curl "${curl_args[@]}" -o /tmp/adaway.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt"
          curl "${curl_args[@]}" -o /tmp/peter_lowe.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_3.txt"
          curl "${curl_args[@]}" -o /tmp/oisd_big.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_27.txt"
          curl "${curl_args[@]}" -o /tmp/awavenue.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_53.txt"
          curl "${curl_args[@]}" -o /tmp/adguard_popup.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_59.txt"
          curl "${curl_args[@]}" -o /tmp/antiad_anv.txt "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/discretion/anv.txt"
          wc -l /tmp/adguard_dns.txt /tmp/adaway.txt /tmp/peter_lowe.txt /tmp/oisd_big.txt \
            /tmp/awavenue.txt /tmp/adguard_popup.txt /tmp/antiad_anv.txt

      - name: Keep only the domestic entries of the OISD big list
        run: |
          set -euo pipefail
          python3 scripts/filter-china.py \
            --in /tmp/oisd_big.txt \
            --out /tmp/oisd_big_cn.txt \
            --brands source/china-brands.txt
          wc -l /tmp/oisd_big_cn.txt

      - name: Build block candidate
        run: |
          set -euo pipefail
          python3 scripts/merge-filter.py build \
            --adblock /tmp/adguard_dns.txt \
            --adblock /tmp/adaway.txt \
            --adblock /tmp/peter_lowe.txt \
            --adblock /tmp/oisd_big_cn.txt \
            --adblock /tmp/awavenue.txt \
            --adblock /tmp/adguard_popup.txt \
            --domain-list /tmp/antiad_anv.txt \
            --output-dir "$FILTER_BUILD_DIR"

      - name: Summarize upstream exceptions
        run: |
          set -euo pipefail
          python3 -c 'import json, os; from pathlib import Path; d=json.loads((Path(os.environ["FILTER_BUILD_DIR"])/"filter-audit.json").read_text()); print("## Filter analysis\n\nPolicy: audit-only; positive blocks win. @@ never selects DIRECT or PROXY.\n"); print("Final rules:", d["result"]["total"]); print("Exception domains overlapping blocks:", d["result"]["overlapping_exception_domains"]); print("\nSource | Suffix | Exact | Parsed/skipped lines\n--- | ---: | ---: | ---"); [print(name, s["block_suffix"], s["block_exact"], json.dumps(s.get("counts", {}), sort_keys=True), sep=" | ") for name, s in d["sources"].items()]' >> "$GITHUB_STEP_SUMMARY"

      - name: Save filter audit for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filter-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FILTER_BUILD_DIR }}/filter-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Guard candidate sizes
        env:
          ACCEPT_LARGE_CHANGE: ${{ inputs.accept_large_change || 'false' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$ACCEPT_LARGE_CHANGE" == "true" ]]; then
            extra+=(--allow-large-change)
          fi
          python3 scripts/guard-ruleset.py \
            --baseline filter.list --candidate "$FILTER_BUILD_DIR/filter.list" \
            --min-ratio 0.80 --max-ratio 1.25 --max-rules 300000 "${extra[@]}"

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Compile and verify candidate before staging
        run: |
          set -euo pipefail
          sing-box rule-set compile \
            --output "$FILTER_BUILD_DIR/filter.srs" \
            "$FILTER_BUILD_DIR/filter.json"
          sing-box rule-set decompile -o "$FILTER_BUILD_DIR/filter.compiled.json" "$FILTER_BUILD_DIR/filter.srs"
          python3 scripts/verify-all.py \
            --list "$FILTER_BUILD_DIR/filter.list" --decompiled "$FILTER_BUILD_DIR/filter.compiled.json"
          install -m 0644 "$FILTER_BUILD_DIR/filter.list" filter.list
          install -m 0644 "$FILTER_BUILD_DIR/filter.srs" filter.srs
          wc -l filter.list
          ls -l filter.srs

      - name: Write deterministic provenance manifest
        run: |
          set -euo pipefail
          python3 scripts/write-manifest.py \
            --name filter --sing-box-version "$SB_VERSION" \
            --source 'adguard-dns|/tmp/adguard_dns.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt' \
            --source 'adaway|/tmp/adaway.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt' \
            --source 'peter-lowe|/tmp/peter_lowe.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_3.txt' \
            --source 'oisd-big|/tmp/oisd_big.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_27.txt' \
            --source 'awavenue|/tmp/awavenue.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_53.txt' \
            --source 'adguard-popup|/tmp/adguard_popup.txt|https://adguardteam.github.io/HostlistsRegistry/assets/filter_59.txt' \
            --source 'anti-ad-anv|/tmp/antiad_anv.txt|https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/discretion/anv.txt' \
            --source 'china-brands|source/china-brands.txt|repository:source/china-brands.txt' \
            --output filter.list --output filter.srs \
            --manifest metadata/filter.json

      - name: Verify every committed pair and manifest
        run: |
          set -euo pipefail
          python3 scripts/verify-all.py

      - name: Commit and push if changed
        run: |
          bash scripts/publish-rulesets.sh \
            "chore: sync filter rules $(date -u +%Y-%m-%d)" \
            filter.list filter.srs metadata/filter.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
