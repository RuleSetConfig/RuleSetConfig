# Upstream data: AdGuard DNS filter and adguard_popup_filter (GPL-3.0), the
# AdAway default blocklist from the AdGuard Hostlists Registry (CC BY 3.0),
# oisd (GPL-3.0), anti-AD anv.txt (MIT). See README "Sources & Credits".
name: Sync Filter Rules

on:
  schedule:
    # UTC 21:13 = 05:13 next day in UTC+8. Avoid the top of the hour: GitHub
    # delays scheduled runs by up to a few hours when the queue is busy.
    - cron: "13 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filter-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0

      - name: Download upstream filter lists
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/adguard_dns.txt "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt"
          curl -fsSL -o /tmp/adguard_popup.txt "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/adguard_popup_filter.txt"
          curl -fsSL -o /tmp/adguard_adaway.txt "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt"
          curl -fsSL -o /tmp/oisd_big.txt "https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/oisd_big.txt"
          curl -fsSL -o /tmp/antiad_anv.txt "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/discretion/anv.txt"
          wc -l /tmp/adguard_dns.txt /tmp/adguard_popup.txt /tmp/adguard_adaway.txt \
            /tmp/oisd_big.txt /tmp/antiad_anv.txt

      - name: Merge, dedupe and generate
        run: |
          set -euo pipefail
          python3 scripts/merge-filter.py build \
            --adblock /tmp/adguard_dns.txt \
            --adblock /tmp/adguard_popup.txt \
            --adblock /tmp/adguard_adaway.txt \
            --adblock /tmp/oisd_big.txt \
            --domain-list /tmp/antiad_anv.txt \
            --list-out filter.list \
            --json-out /tmp/filter.json

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          echo "/tmp/sing-box-${SB_VERSION}-linux-amd64" >> "$GITHUB_PATH"
          echo "sing-box ${SB_VERSION}"

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output filter.srs /tmp/filter.json
          sing-box rule-set decompile -o /tmp/filter.compiled.json filter.srs
          python3 scripts/build-filter-rulesets.py verify \
            --list filter.list --decompiled /tmp/filter.compiled.json
          wc -l filter.list
          ls -l filter.srs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.list filter.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync filter rules $(date -u +%Y-%m-%d)"

          # Scheduled runs may start late, so the checked out commit can be behind
          # the latest main; rebase onto the latest main before pushing and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
