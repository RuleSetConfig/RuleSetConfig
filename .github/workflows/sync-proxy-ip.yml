# Upstream data: Cloudflare IP ranges, Telegram CIDR list, Google goog.json,
# GitHub meta, plus ASN prefixes from RouteViews (CC BY 4.0).
# Local rules: source/proxy-ip.local.list and source/proxy-ip.asn. They take the highest
# priority while pruning, but the generated files contain upstream entries only.
# See README "Sources & Credits".
name: Sync Proxy IP

on:
  schedule:
    # UTC 22:00 = 06:00 in UTC+8, staggered from sync-filter / sync-proxy-direct
    # (21:00 UTC) and sync-direct-ip (21:45 UTC) so jobs do not push at the same time
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-ip-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          echo "/tmp/sing-box-${SB_VERSION}-linux-amd64" >> "$GITHUB_PATH"
          echo "sing-box ${SB_VERSION}"

      - name: Merge, dedupe and generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/build-proxy-ip.py build \
            --local source/proxy-ip.local.list \
            --asn-file source/proxy-ip.asn \
            --cloudflare --telegram --google --github \
            --list-out proxy-ip.list \
            --json-out /tmp/proxy-ip.json \
            --upstream-only

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output proxy-ip.srs /tmp/proxy-ip.json
          sing-box rule-set decompile -o /tmp/proxy-ip.compiled.json proxy-ip.srs
          python3 scripts/build-proxy-ip.py verify \
            --source /tmp/proxy-ip.json \
            --decompiled /tmp/proxy-ip.compiled.json
          wc -l proxy-ip.list
          ls -l proxy-ip.srs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy-ip.list proxy-ip.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync proxy-ip rules $(date -u +%Y-%m-%d)"

          # Scheduled runs may start late, so the checked out commit can be behind
          # the latest main; rebase onto the latest main before pushing and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
