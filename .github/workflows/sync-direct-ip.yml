# Upstream data: mayaxcn/china-ip-list chnroute / chnroute_v6, plus AS132203
# announced prefixes from RouteViews (CC BY 4.0). See README "Sources & Credits".
name: Sync Direct IP

on:
  schedule:
    # UTC 22:23 = 06:23 in UTC+8, clear of sync-filter (21:13). Avoid the top of
    # the hour: GitHub delays scheduled runs by up to a few hours when the queue
    # is busy.
    - cron: "23 22 * * *"
  workflow_dispatch:
    inputs:
      accept_large_change:
        description: Allow an unusual rule-count change after manual review
        required: false
        type: boolean
        default: false

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

permissions:
  contents: write

concurrency:
  group: ruleset-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Download chnroute lists
        run: |
          set -euo pipefail
          curl_args=(--fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300)
          curl "${curl_args[@]}" -o /tmp/chnroute.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/master/chnroute.txt"
          curl "${curl_args[@]}" -o /tmp/chnroute_v6.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/master/chnroute_v6.txt"
          wc -l /tmp/chnroute.txt /tmp/chnroute_v6.txt

      - name: Merge, dedupe and generate
        run: |
          set -euo pipefail
          python3 scripts/build-direct-ip.py build \
            --chnroute /tmp/chnroute.txt \
            --chnroute-v6 /tmp/chnroute_v6.txt \
            --asn 132203 \
            --list-out /tmp/direct-ip.list \
            --json-out /tmp/direct-ip.json

      - name: Guard generated size and publish candidate
        env:
          ACCEPT_LARGE_CHANGE: ${{ inputs.accept_large_change || 'false' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$ACCEPT_LARGE_CHANGE" == "true" ]]; then extra+=(--allow-large-change); fi
          python3 scripts/guard-ruleset.py \
            --baseline direct-ip.list --candidate /tmp/direct-ip.list \
            --min-ratio 0.75 --max-ratio 1.35 --max-rules 30000 "${extra[@]}"
          mv /tmp/direct-ip.list direct-ip.list

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output direct-ip.srs /tmp/direct-ip.json
          python3 scripts/verify-all.py
          wc -l direct-ip.list
          ls -l direct-ip.srs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add direct-ip.list direct-ip.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync direct-ip rules $(date -u +%Y-%m-%d)"

          authenticated_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          public_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$authenticated_remote"
          trap 'git remote set-url origin "$public_remote"' EXIT

          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
