name: Publish Latest Verified Rule-Set Snapshot

on:
  schedule:
    # 16:30 UTC+8 leaves a wide buffer after the daily filter build.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

concurrency:
  # Wait for any in-flight publisher before snapshotting main.
  group: ruleset-publisher
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Record checked-out snapshot revision
        id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify snapshot
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/verify-all.py
          mkdir -p release-assets
          for name in PROXY-DOMAIN-SET PROXY-RULE-SET PROXY-IP-SET DIRECT-DOMAIN-SET DIRECT-RULE-SET DIRECT-IP-SET REJECT-DOMAIN-SET REJECT-RULE-SET REJECT-IP-SET; do
            cp -- "$name.list" "$name.srs" release-assets/
          done
          cp metadata/filter.json release-assets/filter-manifest.json
          cp metadata/tld.json release-assets/tld-manifest.json
          cp metadata/keywords.json release-assets/keywords-manifest.json
          cp metadata/direct-ip.json release-assets/direct-ip-manifest.json
          cp metadata/proxy-ip.json release-assets/proxy-ip-manifest.json
          (cd release-assets && sha256sum -- * > SHA256SUMS)

      - name: Publish immutable daily release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
        run: |
          set -euo pipefail
          tag="rulesets-$(date -u +%Y-%m-%d)-${SNAPSHOT_SHA:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; leaving the immutable snapshot unchanged."
            gh release edit "$tag" --latest
            exit 0
          fi
          gh release create "$tag" \
            --target "$SNAPSHOT_SHA" \
            --title "Rule sets $(date -u +%Y-%m-%d) (${SNAPSHOT_SHA:0:12})" \
            --notes "Automated immutable snapshot from ${SNAPSHOT_SHA}. See SHA256SUMS and the filter, tld, keywords, direct-ip and proxy-ip manifests for integrity and provenance." \
            --latest \
            -- release-assets/*

      - name: Verify uploaded Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          download_dir="${RUNNER_TEMP}/release-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$download_dir"
          gh release download "$RELEASE_TAG" --dir "$download_dir"
          cmp -- release-assets/SHA256SUMS "$download_dir/SHA256SUMS"
          (cd "$download_dir" && sha256sum --check SHA256SUMS)
          echo "VERIFIED_RELEASE_DIRECTORY=$download_dir" >> "$GITHUB_ENV"

      - name: Retain only the latest verified Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          python3 scripts/prune-releases.py \
            --keep-tag "$RELEASE_TAG" \
            --verified-directory "$VERIFIED_RELEASE_DIRECTORY"
