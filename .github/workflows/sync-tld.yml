name: Sync Proxy and Direct Rule Sets

on:
  schedule:
    # UTC 21:43 = 05:43 next day in UTC+8, after the reject build.
    - cron: "43 21 * * *"
  push:
    branches: [main]
    paths:
      - PROXY-DOMAIN-SET.list
      - DIRECT-DOMAIN-SET.list
      - source/proxy-tld-policy.json
      - scripts/iana_proxy.py
      - scripts/iana_direct.py
      - source/domain-keywords.json
      - scripts/sync-domain-sets.py
      - scripts/domain_keywords.py
      - scripts/build-keyword-sets.py
      - PROXY-RULE-SET.list
      - DIRECT-RULE-SET.list
      - scripts/guard-ruleset.py
      - scripts/verify-all.py
      - scripts/filter_patterns.py
      - scripts/filter_optimizer.py
      - scripts/glob_optimizer.py
      - scripts/filter_ips.py
      - scripts/ip_rulesets.py
      - scripts/ruleset_format.py
      - scripts/rule_sorting.py
      - scripts/sort-rulesets.py
      - scripts/write-manifest.py
      - scripts/publish-rulesets.sh
      - tests/**
      - .github/actions/setup-sing-box/**
      - .github/workflows/sync-tld.yml
  workflow_dispatch:
    inputs:
      accept_large_change:
        description: Allow an unusual rule-count change after manual review
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

concurrency:
  group: ruleset-publisher
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Choose isolated candidate directory
        run: echo "DOMAIN_BUILD_DIR=${RUNNER_TEMP}/domain-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Fetch official IANA data and select both TLD pairs
        run: |
          set -euo pipefail
          python3 scripts/sync-domain-sets.py --fetch \
            --source-dir "$DOMAIN_BUILD_DIR/upstream" \
            --output-dir "$DOMAIN_BUILD_DIR/candidate"

      - name: Build companion keyword pairs
        run: |
          python3 scripts/build-keyword-sets.py --output-dir "$DOMAIN_BUILD_DIR/candidate"

      - name: Save domain import audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: domain-sync-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DOMAIN_BUILD_DIR }}/candidate/domain-sync-audit.json
            ${{ env.DOMAIN_BUILD_DIR }}/upstream/iana-tlds.json
          if-no-files-found: error
          retention-days: 14

      - name: Guard candidate sizes
        env:
          ACCEPT_LARGE_CHANGE: ${{ inputs.accept_large_change || 'false' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$ACCEPT_LARGE_CHANGE" == "true" ]]; then
            extra+=(--allow-large-change)
          fi
          for name in PROXY-DOMAIN-SET DIRECT-DOMAIN-SET; do
            python3 scripts/guard-ruleset.py \
              --baseline "$name.list" --candidate "$DOMAIN_BUILD_DIR/candidate/$name.list" \
              --min-ratio 0.80 --max-ratio 1.25 --max-rules 300000 "${extra[@]}"
          done

      - name: Test native sing-box matching
        run: |
          python3 tests/native_filter.py
          python3 tests/native_optimization.py

      - name: Stage verified candidate pairs and manifest
        run: |
          set -euo pipefail
          for name in PROXY-DOMAIN-SET DIRECT-DOMAIN-SET PROXY-RULE-SET DIRECT-RULE-SET; do
            install -m 0644 "$DOMAIN_BUILD_DIR/candidate/$name.list" "$name.list"
            install -m 0644 "$DOMAIN_BUILD_DIR/candidate/$name.srs" "$name.srs"
          done
          install -m 0644 "$DOMAIN_BUILD_DIR/candidate/metadata/tld.json" metadata/tld.json
          install -m 0644 "$DOMAIN_BUILD_DIR/candidate/metadata/keywords.json" metadata/keywords.json

      - name: Verify all pairs, proxy companion priority, equivalent pruning and manifests
        run: python3 scripts/verify-all.py

      - name: Publish changed domain pairs and manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-rulesets.sh \
            "chore: sync proxy and direct domain sets" \
            PROXY-DOMAIN-SET.list PROXY-DOMAIN-SET.srs DIRECT-DOMAIN-SET.list DIRECT-DOMAIN-SET.srs metadata/tld.json \
            PROXY-RULE-SET.list PROXY-RULE-SET.srs DIRECT-RULE-SET.list DIRECT-RULE-SET.srs metadata/keywords.json
