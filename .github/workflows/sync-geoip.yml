# Upstream data: SagerNet/sing-geoip geoip-cn (GPL-3.0), built from MaxMind
# GeoLite2 data via Dreamacro/maxmind-geoip (CC BY-SA 4.0, attribution
# required), plus AS132203 announced prefixes from RIPE Stat.
# See README "Sources & Credits".
name: Sync GeoIP CN (AS132203)

on:
  schedule:
    # 每天 UTC 21:30（北京时间 05:30），错开 sync-filter.yml 的 21:00，避免同时推送
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geoip-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 需要完整历史，推送前才能安全地 pull --rebase 到最新 main
          fetch-depth: 0

      - name: Install sing-box
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          echo "/tmp/sing-box-${SB_VERSION}-linux-amd64" >> "$GITHUB_PATH"
          echo "sing-box ${SB_VERSION}"

      - name: Download and decompile upstream geoip-cn
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/geoip-cn.upstream.srs \
            "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs"
          sing-box rule-set decompile -o /tmp/geoip-cn.upstream.json /tmp/geoip-cn.upstream.srs

      - name: Merge AS132203 prefixes
        run: |
          set -euo pipefail
          python3 scripts/build-geoip-cn.py build \
            --upstream /tmp/geoip-cn.upstream.json \
            --output geoip-cn.json \
            --asn 132203

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output geoip-cn.srs geoip-cn.json
          sing-box rule-set decompile -o /tmp/geoip-cn.compiled.json geoip-cn.srs
          python3 scripts/build-geoip-cn.py verify \
            --source geoip-cn.json \
            --decompiled /tmp/geoip-cn.compiled.json

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geoip-cn.json geoip-cn.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync geoip-cn (AS132203) $(date -u +%Y-%m-%d)"

          # 定时任务可能延迟启动，checkout 到的提交会早于远端最新 main，
          # 因此推送前先变基到最新 main，失败则重试。
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
