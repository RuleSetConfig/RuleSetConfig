# Upstream data: AdGuard DNS filter and adguard_popup_filter (GPL-3.0),
# hagezi/dns-blocklists pro and doh-vpn-proxy-bypass (GPL-3.0),
# oisd (GPL-3.0), anti-AD anv.txt (MIT). See README "Sources & Credits".
name: Sync Filter Rules

on:
  schedule:
    # UTC 21:00 = 05:00 next day in UTC+8; adjust as needed
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filter-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0

      - name: Download upstream filter lists
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/adguard_dns.txt "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt"
          curl -fsSL -o /tmp/adguard_popup.txt "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/adguard_popup_filter.txt"
          curl -fsSL -o /tmp/hagezi_pro.txt "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/pro.txt"
          curl -fsSL -o /tmp/oisd_big.txt "https://raw.githubusercontent.com/sjhgvr/oisd/refs/heads/main/oisd_big.txt"
          curl -fsSL -o /tmp/hagezi_doh_vpn_proxy_bypass.txt "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/doh-vpn-proxy-bypass.txt"
          curl -fsSL -o /tmp/antiad_anv.txt "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/refs/heads/master/discretion/anv.txt"

      - name: Merge, dedupe and generate
        run: |
          python3 - <<'PY'
          import json, re

          def valid_domain(d):
              if not d or len(d) > 253 or d.startswith('.') or d.endswith('.'):
                  return False
              if '*' in d or ' ' in d or '/' in d or '#' in d:
                  return False
              labels = d.split('.')
              if len(labels) < 2:
                  return False
              return all(lab and len(lab) <= 63 and re.fullmatch(r"[a-z0-9_\-]+", lab) for lab in labels)

          def clean(d):
              d = d.strip().lower()
              d = d.split('^', 1)[0].split('/', 1)[0].split('#', 1)[0]
              return d.strip('.')

          # Plain domain lists (anti-AD anv.txt and friends): the whole line is a
          # domain and is treated as a suffix match
          def parse_domain_suffix_list(path):
              out = set()
              with open(path, encoding='utf-8', errors='ignore') as f:
                  for raw in f:
                      s = raw.strip()
                      if not s or s.startswith('#') or s.startswith('!'):
                          continue
                      d = clean(s)
                      if valid_domain(d):
                          out.add(d)
              return out

          def parse_adblock(path):
              suffix, exact = set(), set()
              exc_suffix, exc_exact = set(), set()
              with open(path, encoding='utf-8', errors='ignore') as f:
                  for raw in f:
                      s = raw.strip()
                      if not s or s.startswith('!') or s.startswith('['):
                          continue
                      if s.startswith('/') and s.endswith('/'):
                          continue
                      is_exc = s.startswith('@@')
                      if is_exc:
                          s = s[2:]
                      if '$' in s:
                          s = s.split('$', 1)[0].strip()
                      # hosts style: 0.0.0.0 domain / 127.0.0.1 domain / ::1 domain
                      m = re.match(r"^(?:\d{1,3}(?:\.\d{1,3}){3}|[0-9a-fA-F:]+)\s+(\S+)", s)
                      if m:
                          d = clean(m.group(1))
                          suffix_match = False
                      else:
                          if s.startswith('||'):
                              d = clean(s[2:])
                              suffix_match = True
                          elif s.startswith('|'):
                              d = clean(s[1:])
                              suffix_match = False
                          else:
                              d = clean(s)
                              suffix_match = False
                      if not valid_domain(d):
                          continue
                      if is_exc:
                          (exc_suffix if suffix_match else exc_exact).add(d)
                      else:
                          (suffix if suffix_match else exact).add(d)
              return suffix, exact, exc_suffix, exc_exact

          suffix, exact = set(), set()
          exc_suffix, exc_exact = set(), set()

          for path in ['/tmp/adguard_dns.txt', '/tmp/adguard_popup.txt', '/tmp/hagezi_pro.txt', '/tmp/oisd_big.txt', '/tmp/hagezi_doh_vpn_proxy_bypass.txt']:
              s, e, es, ee = parse_adblock(path)
              suffix |= s
              exact |= e
              exc_suffix |= es
              exc_exact |= ee

          # anti-AD automatic number verification list: plain domains, merged as suffixes
          suffix |= parse_domain_suffix_list('/tmp/antiad_anv.txt')

          # Apply the whitelist exceptions
          suffix -= exc_suffix
          exact -= exc_exact
          # Drop exact entries that are covered by an exception suffix
          exact = {d for d in exact if not any(d == es or d.endswith('.' + es) for es in exc_suffix)}

          def parent_of(d, pool):
              """Return the parent suffix rule covering d, or None."""
              labels = d.split('.')
              for i in range(1, len(labels)):
                  p = '.'.join(labels[i:])
                  if p in pool:
                      return p
              return None

          # Deduplicate ad rules: drop child rules when their parent rule exists.
          # '.a.b.c' is fully covered by '.b.c'; the exact rule 'x.b.c' as well.
          suffix_before, exact_before = len(suffix), len(exact)
          suffix = {d for d in suffix if parent_of(d, suffix) is None}
          exact = {d for d in exact if d not in suffix and parent_of(d, suffix) is None}
          print(f'parent-prune: suffix {suffix_before} -> {len(suffix)}, '
                f'exact {exact_before} -> {len(exact)}')

          # Surge DOMAIN-SET: a leading '.' means suffix match, no prefix means exact
          lines = ['.' + d for d in sorted(suffix)] + [d for d in sorted(exact)]
          with open('filter.list', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')

          # sing-box rule-set source (JSON), compiled into .srs afterwards.
          # Note that domain_suffix treats the leading dot the other way round:
          #   domain_suffix: 'd'  matches d itself and all of its subdomains
          #                       (equivalent to Surge's '.d')
          #   domain_suffix: '.d' matches only subdomains, not d itself
          # So the dotless form is written here to match filter.list's '.d'.
          # (sing-box matches on label boundaries, 'oo.com' does not hit 'notoo.com'.)
          rules = []
          if exact:
              rules.append({'domain': sorted(exact)})
          if suffix:
              rules.append({'domain_suffix': sorted(suffix)})
          with open('/tmp/filter.json', 'w', encoding='utf-8') as f:
              json.dump({'version': 2, 'rules': rules}, f, ensure_ascii=False, separators=(',', ':'))

          print('suffix:', len(suffix))
          print('exact:', len(exact))
          PY

      - name: Compile sing-box rule-set (.srs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          /tmp/sing-box-${SB_VERSION}-linux-amd64/sing-box rule-set compile --output filter.srs /tmp/filter.json

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.list filter.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync filter rules $(date -u +%Y-%m-%d)"

          # Scheduled runs may start late, so the checked out commit can be behind
          # the latest main; rebase onto the latest main before pushing and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
