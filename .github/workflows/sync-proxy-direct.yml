# 远程数据：Loyalsoldier/surge-rules（GPL-3.0）的 proxy.txt / direct.txt。
# 本地规则：source/proxy.local.list、source/direct.local.list，优先级高于远程规则。
name: Sync Proxy Direct Rules

on:
  schedule:
    # UTC 21:00 = 北京时间（UTC+8）次日 05:00
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-direct-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 需要完整历史，推送前才能安全地 pull --rebase 到最新 main
          fetch-depth: 0

      - name: Download upstream lists
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/proxy.remote.txt "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/proxy.txt"
          curl -fsSL -o /tmp/direct.remote.txt "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/direct.txt"
          wc -l /tmp/proxy.remote.txt /tmp/direct.remote.txt

      - name: Merge, dedupe and generate
        run: |
          set -euo pipefail
          python3 scripts/merge-proxy-direct.py \
            --local-proxy source/proxy.local.list \
            --local-direct source/direct.local.list \
            --remote-proxy /tmp/proxy.remote.txt \
            --remote-direct /tmp/direct.remote.txt \
            --outdir . \
            --json-dir /tmp \
            --name-suffix=-set
          wc -l proxy-set.list direct-set.list

      - name: Compile sing-box rule-set (.srs)
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          SB="/tmp/sing-box-${SB_VERSION}-linux-amd64/sing-box"
          $SB rule-set compile --output proxy-set.srs /tmp/proxy-set.json
          $SB rule-set compile --output direct-set.srs /tmp/direct-set.json
          ls -l proxy-set.srs direct-set.srs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy-set.list direct-set.list proxy-set.srs direct-set.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync proxy/direct rules $(date -u +%Y-%m-%d)"

          # 定时任务可能延迟启动，checkout 到的提交会早于远端最新 main，
          # 因此推送前先变基到最新 main，失败则重试。
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
