name: Setup pinned sing-box
description: Install a checksum-verified sing-box release for rule-set compilation

inputs:
  version:
    description: sing-box version without the leading v
    required: true
  sha256:
    description: SHA-256 of the Linux amd64 release archive
    required: true

runs:
  using: composite
  steps:
    - name: Download and verify sing-box
      shell: bash
      env:
        SB_VERSION: ${{ inputs.version }}
        SB_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
        install_root="${RUNNER_TEMP}/sing-box-${SB_VERSION}"
        url="https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"

        curl --fail --show-error --location \
          --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
          --output "$archive" "$url"
        echo "${SB_SHA256}  ${archive}" | sha256sum --check --strict

        mkdir -p "$install_root"
        tar -xzf "$archive" -C "$install_root" --strip-components=1
        "$install_root/sing-box" version
        echo "$install_root" >> "$GITHUB_PATH"
