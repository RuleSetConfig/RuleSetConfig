# Upstream data: the sing-box rule sets geosite-geolocation-!cn (proxy) and geosite-cn
# (direct) from SagerNet/sing-geosite (GPL-3.0), which are built from the geosite data
# of v2fly/domain-list-community (MIT). They are published compiled, so the workflow
# decompiles them before merging. Local rules: source/proxy.local.list and
# source/direct.local.list. They take priority over the upstream lists and decide
# dedupe/pruning; the generated files contain upstream rules only and never repeat a
# rule the local lists already carry.
name: Sync Proxy Direct Rules

on:
  schedule:
    # UTC 21:47 = 05:47 next day in UTC+8, half an hour clear of sync-filter.
    # Avoid the top of the hour: GitHub delays scheduled runs by up to a few
    # hours when the queue is busy.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-direct-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          echo "/tmp/sing-box-${SB_VERSION}-linux-amd64" >> "$GITHUB_PATH"
          echo "sing-box ${SB_VERSION}"

      - name: Download upstream rule sets
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/proxy.remote.srs 'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-geolocation-!cn.srs'
          curl -fsSL -o /tmp/direct.remote.srs 'https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs'
          ls -l /tmp/proxy.remote.srs /tmp/direct.remote.srs

      - name: Decompile upstream rule sets
        run: |
          set -euo pipefail
          # The upstream data is served compiled, so it is decompiled into the JSON
          # that merge-proxy-direct.py reads.
          sing-box rule-set decompile -o /tmp/proxy.remote.json /tmp/proxy.remote.srs
          sing-box rule-set decompile -o /tmp/direct.remote.json /tmp/direct.remote.srs

      - name: Merge, dedupe and generate
        run: |
          set -euo pipefail
          python3 scripts/merge-proxy-direct.py \
            --local-proxy source/proxy.local.list \
            --local-direct source/direct.local.list \
            --remote-proxy /tmp/proxy.remote.json \
            --remote-direct /tmp/direct.remote.json \
            --outdir . \
            --json-dir /tmp \
            --name-suffix=-set \
            --upstream-only
          wc -l proxy-set.list direct-set.list

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output proxy-set.srs /tmp/proxy-set.json
          sing-box rule-set compile --output direct-set.srs /tmp/direct-set.json
          sing-box rule-set decompile -o /tmp/proxy-set.compiled.json proxy-set.srs
          sing-box rule-set decompile -o /tmp/direct-set.compiled.json direct-set.srs
          python3 scripts/build-filter-rulesets.py verify \
            --list proxy-set.list --decompiled /tmp/proxy-set.compiled.json
          python3 scripts/build-filter-rulesets.py verify \
            --list direct-set.list --decompiled /tmp/direct-set.compiled.json
          ls -l proxy-set.srs direct-set.srs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy-set.list direct-set.list proxy-set.srs direct-set.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync proxy/direct rules $(date -u +%Y-%m-%d)"

          # Scheduled runs may start late, so the checked out commit can be behind
          # the latest main; rebase onto the latest main before pushing and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
