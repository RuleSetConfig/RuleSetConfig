# Guards the committed rule sets: decompiles every .srs and checks it still
# matches the .list next to it.
name: Verify Rule Sets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

concurrency:
  group: verify-rulesets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Test native sing-box matching
        run: python3 tests/native_filter.py

      - name: Verify the committed rule sets
        run: |
          set -euo pipefail
          python3 scripts/verify-all.py
