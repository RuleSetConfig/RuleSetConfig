# Upstream data: Cloudflare IP ranges, Telegram CIDR list, Google goog.json,
# GitHub meta, plus ASN prefixes from RouteViews (CC BY 4.0).
# Local rules: source/proxy-ip.local.list and source/proxy-ip.asn. They take the highest
# priority while pruning, but the generated files contain upstream entries only.
# See README "Sources & Credits".
name: Sync Proxy IP

on:
  schedule:
    # UTC 22:53 = 06:53 in UTC+8, clear of the other sync jobs. Avoid the top of
    # the hour: GitHub delays scheduled runs by up to a few hours when busy.
    - cron: "53 22 * * *"
  workflow_dispatch:
    inputs:
      accept_large_change:
        description: Allow an unusual rule-count change after manual review
        required: false
        type: boolean
        default: false

env:
  SB_VERSION: "1.14.2"
  SB_LINUX_AMD64_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

permissions:
  contents: write

concurrency:
  group: ruleset-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned sing-box
        uses: ./.github/actions/setup-sing-box
        with:
          version: ${{ env.SB_VERSION }}
          sha256: ${{ env.SB_LINUX_AMD64_SHA256 }}

      - name: Merge, dedupe and generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/build-proxy-ip.py build \
            --local source/proxy-ip.local.list \
            --asn-file source/proxy-ip.asn \
            --cloudflare --telegram --google --github \
            --list-out /tmp/proxy-ip.list \
            --json-out /tmp/proxy-ip.json \
            --upstream-only

      - name: Guard generated size and publish candidate
        env:
          ACCEPT_LARGE_CHANGE: ${{ inputs.accept_large_change || 'false' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$ACCEPT_LARGE_CHANGE" == "true" ]]; then extra+=(--allow-large-change); fi
          python3 scripts/guard-ruleset.py \
            --baseline proxy-ip.list --candidate /tmp/proxy-ip.list \
            --min-ratio 0.65 --max-ratio 1.50 --max-rules 5000 "${extra[@]}"
          mv /tmp/proxy-ip.list proxy-ip.list

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output proxy-ip.srs /tmp/proxy-ip.json
          python3 scripts/verify-all.py
          wc -l proxy-ip.list
          ls -l proxy-ip.srs

      - name: Commit and push if changed
        run: |
          bash scripts/publish-rulesets.sh \
            "chore: sync proxy-ip rules $(date -u +%Y-%m-%d)" \
            proxy-ip.list proxy-ip.srs
        env:
          GITHUB_TOKEN: ${{ github.token }}
