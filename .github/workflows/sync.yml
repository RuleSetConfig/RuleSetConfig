name: Sync Surge Rules

on:
  schedule:
    # 每天 UTC 21:00（北京时间 05:00）自动同步，可按需修改
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 需要完整历史，推送前才能安全地 pull --rebase 到最新 main
          fetch-depth: 0

      - name: Download upstream lists
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/proxy.raw "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/proxy.txt"
          curl -fsSL -o /tmp/direct.raw "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/direct.txt"

      - name: Deduplicate (proxy-first)
        run: |
          python3 - <<'PY'
          def load(path):
              items = set()
              with open(path, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      x = line.strip().lower()
                      if not x or x.startswith("#"):
                          continue
                      items.add(x)
              return items

          proxy = load("/tmp/proxy.raw")
          direct = load("/tmp/direct.raw")

          # 代理规则在前，交叉重复时以代理为准
          direct -= proxy

          # 输出 DOMAIN-SET 格式：每行一个域名，"." 前缀表示后缀匹配
          with open("proxy.list", "w", encoding="utf-8") as f:
              f.write("\n".join(sorted(proxy)) + "\n")
          with open("direct.list", "w", encoding="utf-8") as f:
              f.write("\n".join(sorted(direct)) + "\n")

          print("proxy:", len(proxy))
          print("direct:", len(direct))
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy.list direct.list
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync surge rules $(date -u +%Y-%m-%d)"

          # 定时任务可能延迟启动，checkout 到的提交会早于远端最新 main，
          # 因此推送前先变基到最新 main，失败则重试。
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
