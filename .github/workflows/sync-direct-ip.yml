# Upstream data: mayaxcn/china-ip-list chnroute / chnroute_v6, plus AS132203
# announced prefixes from RouteViews (CC BY 4.0). See README "Sources & Credits".
name: Sync Direct IP

on:
  schedule:
    # UTC 21:45 = 05:45 in UTC+8, staggered from sync-filter and
    # sync-proxy-direct (both 21:00 UTC) so the jobs do not push at the same time
    - cron: "45 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-ip-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history is required so that pulling --rebase before pushing is safe
          fetch-depth: 0

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          SB_VERSION="${SB_VERSION#v}"
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          echo "/tmp/sing-box-${SB_VERSION}-linux-amd64" >> "$GITHUB_PATH"
          echo "sing-box ${SB_VERSION}"

      - name: Download chnroute lists
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/chnroute.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/master/chnroute.txt"
          curl -fsSL -o /tmp/chnroute_v6.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/master/chnroute_v6.txt"
          wc -l /tmp/chnroute.txt /tmp/chnroute_v6.txt

      - name: Merge, dedupe and generate
        run: |
          set -euo pipefail
          python3 scripts/build-direct-ip.py build \
            --chnroute /tmp/chnroute.txt \
            --chnroute-v6 /tmp/chnroute_v6.txt \
            --asn 132203 \
            --list-out direct-ip.list \
            --json-out /tmp/direct-ip.json

      - name: Compile and verify
        run: |
          set -euo pipefail
          sing-box rule-set compile --output direct-ip.srs /tmp/direct-ip.json
          sing-box rule-set decompile -o /tmp/direct-ip.compiled.json direct-ip.srs
          python3 scripts/build-direct-ip.py verify \
            --source /tmp/direct-ip.json \
            --decompiled /tmp/direct-ip.compiled.json
          wc -l direct-ip.list
          ls -l direct-ip.srs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add direct-ip.list direct-ip.srs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sync direct-ip rules $(date -u +%Y-%m-%d)"

          # Scheduled runs may start late, so the checked out commit can be behind
          # the latest main; rebase onto the latest main before pushing and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed to main on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying with latest main..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
